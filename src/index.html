<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Play Battleship against an AI opponent. Enter your admiral name to begin."
    />
    <title>Battleship</title>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <header>
      <h1>BATTLESHIP</h1>
    </header>
    <main>
      <form id="admiral-form" action="./battleground.html" method="get">
        <label for="admiral">Admiral name</label>
        <div class="admiral-field">
          <input
            type="text"
            name="admiral"
            id="admiral"
            maxlength="12"
            autocomplete="nickname"
            placeholder="Admiral Name"
            required
          />
          <span id="admiral-typehint" class="admiral-typehint" aria-hidden="true"></span>
        </div>
        <button type="submit" id="battle-btn" disabled>
          <span>BATTLE</span>
        </button>
      </form>
    </main>
  </body>
</html>
